name: site-deployer

# Supporting stack: the tunnel, plus the metrics pipeline.
#
# The network is created by the deployer on startup, so bring that up first:
#   docker network create site-deployer   # or just start the deployer once
#   docker compose --env-file ../.env up -d
#
# CLOUDFLARE_TUNNEL_TOKEN is the *tunnel* token from the Zero Trust dashboard
# (Networks -> Tunnels -> your tunnel -> Configure). It is not the API token the
# deployer uses; that one is CLOUDFLARE_API_TOKEN.
#
# Ingress is managed remotely: the deployer PUTs the rule list to Cloudflare and
# cloudflared picks it up. Do not add a config file here, and do not edit the
# tunnel's ingress in the dashboard while the deployer is running - the API has
# no compare-and-swap, so whoever writes last wins.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - site-deployer
    healthcheck:
      test: ['CMD', 'cloudflared', '--version']
      interval: 60s
      timeout: 5s
      retries: 3

  # Probes each site over HTTP. Joined to the site network so it can reach
  # containers by name, which works whether or not Cloudflare is configured.
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks:
      - site-deployer

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The deployer writes this directory; Prometheus file_sd watches it, so
      # adding or removing a site changes what is probed with no reload.
      #
      # Deliberately NOT ${PROMETHEUS_TARGETS_DIR}: the deployer resolves that
      # variable from the repo root while Compose resolves bind mounts from this
      # file's directory, so one relative value means two different directories
      # and the site-probes job silently finds nothing. Override with an
      # absolute PROMETHEUS_TARGETS_MOUNT only if the deployer's target
      # directory is moved off its default.
      - ${PROMETHEUS_TARGETS_MOUNT:-../data/prometheus-targets}:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    # The deployer's /metrics endpoint runs on the host, not in this network.
    # Docker Desktop resolves host.docker.internal natively; on Linux this entry
    # is what makes the same name work.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - site-deployer

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
    networks:
      - site-deployer

volumes:
  prometheus-data:
  grafana-data:

networks:
  site-deployer:
    external: true
    name: ${DOCKER_NETWORK:-site-deployer}
